# Viducate Nginx Configuration
# /etc/nginx/sites-available/viducate

server {
    listen 80;
    server_name edu.mutkukucuk.com;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    # Frontend (React build)
    location / {
        root /home/utku/viducate/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Video uploads - Range request desteği ile streaming
    location /uploads/ {
        alias /home/utku/viducate/backend/uploads/;
        expires 1y;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        
        # Video dosyaları için özel ayarlar (streaming için kritik)
        location ~* \.(mp4|webm|avi|mov|wmv|flv|mkv)$ {
            add_header Cache-Control "public, max-age=3600";
            add_header Accept-Ranges bytes;
            
            # Video streaming için optimize edilmiş ayarlar
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            
            # Range request desteği için
            proxy_max_temp_file_size 0;
        }
    }

    # Health check
    location /health {
        proxy_pass http://localhost:8080/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
